# Configuration for function minimization example
max_iterations: 10
checkpoint_interval: 5

# LLM configuration
llm:
  primary_model: "deepseek-flash"
  primary_model_weight: 1.0
  # Optional second model, mixed into the ensemble by weight. Costs ~6x more per
  # token than deepseek-flash, so it stays off by default:
  # secondary_model: "deepseek-v4-pro"
  # secondary_model_weight: 0.2
  api_base: "https://api.deepseek.com"
  # OpenEvolve resolves ${VAR} at config-load time, so the key comes from
  # $DEEPSEEK_API_KEY. Alternatively drop this line and export OPENAI_API_KEY
  # (the OpenAI SDK reads that variable by default).
  api_key: "${DEEPSEEK_API_KEY}"
  # deepseek-flash has thinking mode ON by default (effort=high), and thinking
  # tokens are billed as output tokens. An evolution run makes hundreds of calls,
  # so "none" disables thinking for a much cheaper and faster loop. Use
  # "low"/"high" if you want the model to reason before editing. Note that
  # `temperature` only takes effect in non-thinking mode, which is what we want.
  reasoning_effort: "none"
  temperature: 0.7
  max_tokens: 16000
  timeout: 120

# Prompt configuration
prompt:
  system_message: "You are an expert programmer specializing in optimization algorithms. Your task is to improve a function minimization algorithm to find the global minimum of a complex function with many local minima. The function is f(x, y) = sin(x) * cos(y) + sin(x*y) + (x^2 + y^2)/20. Focus on improving the search_algorithm function to reliably find the global minimum, escaping local minima that might trap simple algorithms."

# Database configuration
database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7

  # embedding_model: "text-embedding-3-small"
  similarity_threshold: 0.99

# Evaluator configuration
evaluator:
  timeout: 60
  cascade_thresholds: [1.3]
  parallel_evaluations: 3

# Evolution settings
diff_based_evolution: true
max_code_length: 20000
