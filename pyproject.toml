[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openevolve"
dynamic = ["version"]
description = "Open-source implementation of AlphaEvolve"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "codelion" }]
dependencies = [
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "numpy>=1.22.0",
    "tqdm>=4.64.0",
    "flask",
    "dacite>=1.9.2",
]

[project.optional-dependencies]
dev = [
    # pytest 8+ is required because the config below gates on
    # pytest.PytestReturnNotNoneWarning, which older releases do not expose
    # (an unresolvable category in filterwarnings is a hard config error).
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "mypy>=0.950",
    "types-PyYAML>=6.0",
    "requests>=2.28.0",
    "pre-commit>=4.5.1",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
files = ["openevolve"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# h5py ships no type information; the trace exporter imports it lazily and is
# guarded at runtime, so a missing stub must not be a hard error.
[[tool.mypy.overrides]]
module = ["h5py"]
ignore_missing_imports = true

[project.scripts]
openevolve-run = "openevolve.cli:main"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests requiring external services",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
# A test that returns a non-None value is almost always a test that forgot to
# assert something (this is how `test_regional_endpoint` silently "passed" for
# months). Turn the warning into a failure so it cannot regress.
filterwarnings = [
    "error::pytest.PytestReturnNotNoneWarning",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["openevolve"]
omit = ["openevolve/_version.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "if __name__ == .__main__.:",
]

[tool.setuptools.packages.find]
include = ["openevolve*"]

[tool.setuptools.package-data]
openevolve = ["prompts/defaults/*.txt", "prompts/defaults/*.json"]

[tool.setuptools.dynamic]
version = { attr = "openevolve._version.__version__" }
